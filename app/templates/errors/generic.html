{% extends "base.html" %}

{% block title %}Request error{% endblock %}

{% block content %}
<section class="card" aria-labelledby="error-title">
  <h1 id="error-title">{{ error.code }} {{ error.name }}</h1>
  <p>{{ error.description }}</p>
  <p><a href="{{ url_for('main.index') }}">Return to the home page</a></p>
</section>
{% endblock %}
